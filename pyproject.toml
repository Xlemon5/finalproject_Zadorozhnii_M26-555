[project]
name = "finalproject-zadorozhnii-m26-555"
version = "0.1.0"
description = "A console application simulating a currency wallet."
readme = "README.md"
authors = [
    { name = "Xlemon5", email = "80254502+Xlemon5@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.4",
    "requests>=2.32.3",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"
wallet = "valutatrade_hub.cli.interface:main"
rates-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""
source-include = [
    "main.py", "tests/**", "Makefile", ".python-version",
    "scripts/**", "docs/**", ".env.example",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
history_file = "exchange_rates.json"
request_timeout = 10
parser_interval_seconds = 300
parser_log_file = "parser.log"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_file = "actions.log"
log_format = "json"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3
log_verbose = false
